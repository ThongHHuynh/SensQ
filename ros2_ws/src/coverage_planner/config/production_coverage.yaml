production_path_gen:
  ros__parameters:
    # topics
    map_topic: /coverage/safe_map
    path_topic: /coverage/path
    coverage_status_topic: /coverage/status

    # sweep geometry
    coverage_width_m: 0.3
    waypoint_spacing_m: 1.5
    min_segment_length_m: 0.2
    min_cell_area_m2: 0.5
    sweep_direction: auto          # horizontal, vertical, or auto (picks shorter path)

    # transitions
    validation_step_m: 0.05
    transition_sample_m: 0.05
    use_diagonal_astar: true       # 8-connected vs 4-connected A*
    max_astar_iterations: 50000    # hard cap on A* nodes expanded per transition

    # path quality
    reject_unsafe_path: true
    simplify_tolerance_m: 0.08     # RDP simplification epsilon
    optimize_cell_order: true      # enable 2-opt improvement

    # robot
    robot_base_frame: base_link
    map_frame: map

coverage_visualizer_node:
  ros__parameters:
    map_topic: /coverage/safe_map
    min_segment_length_m: 0.5
    min_cell_area_m2: 0.5
    sweep_direction: auto
    show_cell_labels: true
    cell_label_height_m: 0.25
    cell_label_z_m: 0.2

coverage_executor_node:
  ros__parameters:
    map_topic: /coverage/safe_map
    path_topic: /coverage/path
    coverage_width_m: 0.3
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    action_server_timeout_s: 5.0
    resume_overlap_m: 0.15
    progress_update_threshold_m: 0.02
    controller_path_spacing_m: 0.20
    entry_tolerance_m: 0.25
    execution_timeout_s: 0.0       # 0 disables total mission timeout
    progress_timeout_s: 30.0       # watchdog if remaining path distance stops decreasing
    robot_base_frame: base_link
    map_frame: map
