apriltag_node:
  ros__parameters:
    image_transport: raw
    family: 36h11
    # Simulation-specific AprilTag detection edge length.
    size: 0.16
    max_hamming: 0
    qos_profile: system_default

    detector:
      threads: 2
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    tag:
      ids: [0, 1]
      frames: [tag_0, tag_1]
      sizes: [0.16, 0.16]
