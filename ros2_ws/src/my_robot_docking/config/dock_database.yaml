# Real-robot stations preserve recorded map poses and set explicit predocking
# distances.
#
# These docks are written by record_dock_pose, so reference_pose is the raw
# tag frame pose and its yaw lies in the tag plane, NOT along the approach
# direction. The approach direction is derived from reference_pose minus
# staging_pose, and reference_pose[2] is ignored. Do not copy these yaw values
# into a dock defined with staging_distance: that form reads reference_pose[2]
# as the approach direction and would aim the dock a quarter turn off.
schema_version: 2

docks:
  home_dock:
    tag_id: 1
    tag_frame: "tag_1"
    global_frame: "map"
    reference_pose: [-0.185, -0.188, 1.577]
    staging_pose: [0.131, -0.196, -3.129]
    predocking_distance: 0.816101
    final_distance: 0.2
    lateral_offset: 0.0
    yaw_offset: 0.0
    reverse_docking: false

  dock-1:
    tag_id: 0
    tag_frame: "tag_0"
    global_frame: "map"
    reference_pose: [-0.171, -1.741, 1.488]
    staging_pose: [0.289, -1.783, 3.057]
    predocking_distance: 0.961913
    final_distance: 0.3
    lateral_offset: 0.0
    yaw_offset: 0.0
    reverse_docking: false
