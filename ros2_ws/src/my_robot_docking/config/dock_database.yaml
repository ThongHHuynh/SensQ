#version of the database schema. Increment this when making changes to the database format.
schema_version: 2

docks:
  home_dock:
    tag_id: 0
    tag_frame: "tag_0"
    global_frame: "map"

    # Approximate tag location in map: [x, y, yaw].
    reference_pose: [3.34689, 0.003265, 0.0]

    # Tag-relative base_footprint distances on the docking centerline.
    predocking_distance: 1.5
    staging_distance: 1.04689
    final_distance: 0.3
    lateral_offset: 0.0
    yaw_offset: 0.0

    # true: capture the tag, rotate 180 degrees, then back into this pose.
    reverse_docking: true

  flex_dock1:
    tag_id: 1
    tag_frame: "tag_1"
    global_frame: "map"

    reference_pose: [1.0, 5.18213, 1.5708]
    predocking_distance: 1.5
    staging_distance: 1.18213
    final_distance: 0.3
    lateral_offset: 0.0
    yaw_offset: 0.0

    # final_distance must be at least docking_config.minimum_tag_distance.
    reverse_docking: false
