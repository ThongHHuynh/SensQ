docking_server:
  ros__parameters:
    # Frames
    base_frame: base_footprint

    # ROS interfaces
    dock_action: /dock
    navigate_to_pose_action: /navigate_to_pose
    detections_topic: /detections
    odom_topic: /odometry/filtered
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel_dock

    # Runtime
    use_sim_time: true
    control_rate: 20.0
    max_retries: 3
    return_to_staging_on_retry: false

    # Timeouts
    transform_timeout: 0.05
    tag_timeout: 0.80
    tag_loss_grace_period: 1.50
    tag_search_timeout: 25.0
    navigation_timeout: 120.0
    # Hand off before DWB's observed near-goal progress plateau (~0.21 m).
    predocking_acceptance_distance: 0.25  # 0 disables early visual handoff
    navigation_feedback_rate: 5.0
    approach_timeout: 30.0
    verification_duration: 0.30

    # Search
    search_angular_speed: 0.15
    search_angle_limit: 1.57

    # Retry recovery
    retry_backup_distance: 0.20  # metres
    retry_backup_speed: 0.1
    retry_rotation_angle: 1.57  # radians
    retry_rotation_speed: 0.20  # radians/second
    retry_recovery_timeout: 10.0  # seconds
    # Circumscribed footprint radius (0.17 m, camera nose) plus margin.
    rotation_stop_distance: 0.22

    # Controller limits
    max_linear_speed: 0.10
    min_linear_speed: 0.03
    max_angular_speed: 0.35
    min_angular_speed: 0.10
    max_linear_acceleration: 0.20
    max_angular_acceleration: 0.80

    # Controller gains
    distance_kp: 0.40
    heading_kp: 0.80   # bearing hold while driving an entry leg
    cross_track_kp: 1.20  # perpendicular deviation from the approach axis
    yaw_kp: 0.40

    # Corridor approach. The robot is placed on the dock's approach axis and
    # then run down it; steering straight at the docked pose cuts the corner
    # and sweeps the robot across the dock face.
    corridor_half_width: 0.12   # inside this, no repositioning is needed
    entry_margin: 0.05          # slack behind the docked pose before re-entry
    entry_yaw_tolerance: 0.25
    entry_position_tolerance: 0.06
    align_yaw_tolerance: 0.05   # must be tighter than yaw_tolerance
    overshoot_margin: 0.08      # must exceed distance_tolerance
    approach_taper_distance: 0.25
    enter_drive_abort_angle: 0.60  # re-aim rather than arc onto a waypoint
    run_abort_yaw: 0.50
    dock_keepout_radius: 0.35   # entry legs orbit rather than cross this
    entry_arc_step: 0.50        # radians per arc leg when orbiting
    max_corridor_replans: 3

    # Tag anchoring. One detection carries enough angular noise to tilt the
    # whole approach axis, so the first anchor is averaged and later ones are
    # low-passed onto it.
    anchor_samples: 5
    anchor_timeout: 1.50
    anchor_filter_alpha: 0.35

    # Final-pose tolerances
    distance_tolerance: 0.03
    lateral_tolerance: 0.03
    yaw_tolerance: 0.08

    # Safety. Stop distances are measured from base_footprint and must clear
    # the circumscribed footprint radius of 0.17 m (the camera nose at 0.163 m),
    # or the stop only fires once the robot has already made contact.
    minimum_tag_distance: 0.10
    front_stop_distance: 0.22
    front_sector_half_angle: 0.35
    rear_stop_distance: 0.22
    rear_sector_half_angle: 0.35
    # Inside final_distance + this band the dock fills the sector being driven
    # into, so the directional stop is muted and minimum_tag_distance guards.
    dock_contact_distance: 0.15
    # Bearing half-width around the tag ignored by the rotation clearance.
    rotation_clearance_exclusion: 0.60
    # lidar_link is mounted pi radians from base_footprint: pi=front, 0=rear.
    scan_forward_angle: 3.14159
    # Bounds the odometry-guided rear-first leg, which now runs only from the
    # staging distance to the final distance.
    max_reverse_distance: 0.80
    sensor_timeout: 0.50
    command_timeout: 0.25
    require_fresh_odometry: true
    require_fresh_scan: true
    tag_normal_sign: -1.0

    # RViz reference targets and stage-colored executed trails
    visualization_enabled: true
    visualization_topic: /docking/markers
    visualization_line_width: 0.03
    visualization_min_point_distance: 0.01
    visualization_publish_rate: 10.0
    visualization_maximum_points: 3000

    # The launch file should override this with the installed database path.
    dock_database_file: ""

velocity_arbiter:
  ros__parameters:
    use_sim_time: true
    nav_input_topic: /cmd_vel
    dock_input_topic: /cmd_vel_dock
    output_topic: /cmd_vel_out
    nav_timeout: 0.50
    dock_timeout: 0.25
    publish_rate: 50.0
