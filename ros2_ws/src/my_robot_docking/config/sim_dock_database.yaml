# Simulation stations use tag-relative poses for predocking and staging.
#
# These docks are hand authored with staging_distance, so reference_pose[2] IS
# the approach direction: the heading the robot holds while driving into the
# dock. That is a different convention from the recorded docks in
# dock_database.yaml, where the same field holds the tag frame's own yaw.
schema_version: 2

docks:
  home_dock:
    tag_id: 0
    tag_frame: "tag_0"
    global_frame: "map"
    reference_pose: [3.34689, 0.003265, 0.0]
    predocking_distance: 1.5
    staging_distance: 0.75
    final_distance: 0.3
    lateral_offset: 0.0
    yaw_offset: 0.0
    reverse_docking: false

  flex_dock1:
    tag_id: 1
    tag_frame: "tag_1"
    global_frame: "map"
    reference_pose: [1.0, 5.18213, 1.5708]
    predocking_distance: 1.5
    staging_distance: 0.75
    final_distance: 0.3
    lateral_offset: 0.0
    yaw_offset: 0.0
    reverse_docking: false
